name: AI Content Translation

on:
  push:
    branches:
      - main
    paths:
      - 'docs/zh/**.md'
      - 'docs/en/**.md'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  translate:
    runs-on: ubuntu-latest
    if: "contains(github.event.head_commit.message, '[translate]') || github.event_name == 'workflow_dispatch'"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Get Changed Files
        id: changed-files
        uses: tj-actions/changed-files@v44
        with:
          files: |
            docs/zh/**.md
            docs/en/**.md
          separator: " "

      - name: Run AI Translator
        if: steps.changed-files.outputs.any_changed == 'true'
        env:
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          LLM_BASE_URL: ${{ vars.LLM_BASE_URL }}
          LLM_MODEL: ${{ vars.LLM_MODEL }}
        run: |
          echo "Translating files: ${{ steps.changed-files.outputs.all_changed_files }}"
          node scripts/ai_translate.js ${{ steps.changed-files.outputs.all_changed_files }}

      - name: Create Pull Request
        if: steps.changed-files.outputs.any_changed == 'true'
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "docs: auto-translate content"
          branch: ai/translate
          title: "🤖 AI Translation Update"
          body: |
            Automated translation updates triggered by content changes.
            
            **Processed Files:**
            ${{ steps.changed-files.outputs.all_changed_files }}
          add-paths: |
            docs/zh/**
            docs/en/**
